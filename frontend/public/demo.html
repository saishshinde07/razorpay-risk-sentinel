<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Risk Sentinel - Live Demo</title>
    <style>
        body, html { margin: 0; padding: 0; height: 100%; overflow: hidden; font-family: sans-serif; background: #0f172a;}
        .top-bar { background: #1e293b; color: white; padding: 12px 24px; display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid #334155;}
        .instruction { background: #ef4444; color: white; padding: 6px 12px; border-radius: 4px; font-weight: bold; font-size: 14px; animation: pulse 2s infinite;}
        .container { display: flex; height: calc(100vh - 50px); width: 100vw; }
        iframe { border: none; height: 100%; }
        .store-frame { width: 40%; border-right: 2px solid #334155; }
        .dashboard-frame { width: 60%; }
        
        @keyframes pulse {
            0% { transform: scale(1); }
            50% { transform: scale(1.05); }
            100% { transform: scale(1); }
        }
    </style>
</head>
<body>
    <div class="top-bar">
        <div style="font-weight: 600;">Razorpay Risk Sentinel - Interactive Demo</div>
        <div class="instruction">👈 Try it: Click "Simulate Bot Attack" on the laptop!</div>
    </div>
    <div class="container">
        <iframe class="store-frame" src="/store.html"></iframe>
        <iframe class="dashboard-frame" src="/"></iframe>
    </div>
</body>
</html>
